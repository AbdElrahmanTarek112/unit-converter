<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Converter</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Varela+Round&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="d-flex">
    <form class="container d-flex">
      <fieldset class="box justify-content-center gap-3">
        <h2 class="text-center">Unit Converter</h2>
        <nav class="nav gap-3" id="nav">
          <div class="nav-item active-link" onclick="length(this)" id="length">
            Length
          </div>
          <div class="nav-item" onclick="Weight(this)" id="weight">Weight</div>
          <div class="nav-item" onclick="Temperature(this)" id="temperature">
            Temperature
          </div>
        </nav>
        <section class="d-flex flex-column gap-3">
          <label for="unit" id="unit">Enter the length to convert</label>
          <input type="number" class="unit" id="number" required />
          <label for="from" id="from">Unit to convert from</label>
          <select name="from" id="from-list"></select>
          <label for="to" id="to">Unit to convert to</label>
          <select name="to" id="to-list"></select>
          <button class="btn" onclick="convert()">Convert</button>
        </section>
      </fieldset>
    </form>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
